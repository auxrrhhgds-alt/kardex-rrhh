<style>
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#EEEBE2;color:#141413}
  img{max-width:100%}
  #root{min-height:100vh}
  /* El fondo beige de la pagina (arriba) es solo para la pantalla. Sin esta regla, al imprimir
     cualquier documento (boletas, guias de despacho, fichas, etc.) ese beige se ve detras/alrededor
     del papel impreso -- el usuario lo reporto viendo un margen gris-beige de mas en la hoja
     impresa. En pantalla no cambia nada; solo aplica al imprimir / vista previa de impresion. */
  @media print { body{background:#FFFFFF!important} }
</style>
</head>

<div id="root"></div>
